name: one-shot-type3-doctor-fix

on:
  push:
    paths:
      - .github/workflows/doctor-online-type3-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch online Type 3 detection semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bjut_auth.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit('expected source block not found:\n' + old)
              text = text.replace(old, new, 1)

          replace_once(
              'def get_observed_ipv6(interface, timeout=6, retries=1):',
              'def get_observed_ipv6(interface, timeout=6, retries=1, allow_portal_only=False):',
          )

          replace_once(
              '''    try:\n        result = int(data.get("result", 0))\n    except (TypeError, ValueError):\n        result = 0\n    if result != 1:\n        raise AuthError("IPv6 地址发现接口未返回成功结果")\n    value = str(data.get("ip", "")).strip()\n    try:\n        address = ipaddress.ip_address(value)\n    except ValueError as exc:\n        raise AuthError("IPv6 地址发现接口返回了无效地址") from exc\n    if address.version != 6:\n        raise AuthError("IPv6 地址发现接口没有返回 IPv6")\n    return str(address)\n''',
              '''    try:\n        result = int(data.get("result"))\n    except (TypeError, ValueError) as exc:\n        raise AuthError("IPv6 地址发现接口未返回有效 result 字段") from exc\n    if result != 1:\n        if allow_portal_only:\n            return ""\n        raise AuthError("IPv6 地址发现接口未返回成功结果")\n    value = str(data.get("ip", "")).strip()\n    try:\n        address = ipaddress.ip_address(value)\n    except ValueError as exc:\n        if allow_portal_only:\n            return ""\n        raise AuthError("IPv6 地址发现接口返回了无效地址") from exc\n    if address.version != 6:\n        if allow_portal_only:\n            return ""\n        raise AuthError("IPv6 地址发现接口没有返回 IPv6")\n    return str(address)\n''',
          )

          replace_once(
              'def detect_login_type(interface, allow_http_fallback, probe_timeout=3, retries=1):\n    if not interface_is_wireless(interface):\n        get_observed_ipv6(interface, timeout=probe_timeout, retries=retries)\n        return "3"\n',
              'def detect_login_type(\n    interface, allow_http_fallback, probe_timeout=3, retries=1,\n    require_login_ready=True,\n):\n    if not interface_is_wireless(interface):\n        if require_login_ready:\n            get_observed_ipv6(interface, timeout=probe_timeout, retries=retries)\n        else:\n            get_observed_ipv6(\n                interface, timeout=probe_timeout, retries=retries,\n                allow_portal_only=True,\n            )\n        return "3"\n',
          )

          replace_once(
              '            detect_login_type(interface, allow_http_fallback, probe_timeout=2, retries=0)\n',
              '            detect_login_type(\n                interface, allow_http_fallback, probe_timeout=2, retries=0,\n                require_login_ready=False,\n            )\n',
          )

          replace_once(
              '''        print(\n            "internet: "\n            + ("online" if internet_online(interface, connectivity_url(config)) else "offline")\n        )\n        try:\n            print(f"portal: type {detect_login_type(interface, allow_http)}")\n''',
              '''        online = internet_online(interface, connectivity_url(config))\n        print("internet: " + ("online" if online else "offline"))\n        try:\n            print(\n                "portal: type "\n                + detect_login_type(\n                    interface, allow_http, require_login_ready=not online\n                )\n            )\n''',
          )

          replace_once(
              '''        if args.command == "detect":\n            login_type = args.login_type or login_type_value(config)\n            if login_type == "auto":\n                login_type = detect_login_type(interface, allow_http)\n''',
              '''        if args.command == "detect":\n            login_type = args.login_type or login_type_value(config)\n            if login_type == "auto":\n                login_type = detect_login_type(\n                    interface, allow_http, require_login_ready=False\n                )\n''',
          )

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_type3_online_doctor.py')
          test.write_text(r'''import argparse
import importlib.util
import unittest
from pathlib import Path
from unittest import mock

MODULE_PATH = Path(__file__).resolve().parents[1] / "bjut_auth.py"
spec = importlib.util.spec_from_file_location("bjut_auth_type3_doctor", MODULE_PATH)
mod = importlib.util.module_from_spec(spec)
spec.loader.exec_module(mod)


def args(**kwargs):
    defaults = {
        "username": None,
        "password": None,
        "interface": None,
        "login_type": None,
        "allow_http_fallback": False,
        "config": None,
        "command": "doctor",
    }
    defaults.update(kwargs)
    return argparse.Namespace(**defaults)


class Type3OnlineDoctorTests(unittest.TestCase):
    def test_portal_only_probe_accepts_result_zero(self):
        body = 'dr1004({"result":0,"msg":"already online"});'
        with mock.patch.object(mod, "curl_get", return_value=body):
            self.assertEqual(
                mod.get_observed_ipv6("enp7s0", allow_portal_only=True), ""
            )

    def test_login_probe_still_rejects_result_zero(self):
        body = 'dr1004({"result":0,"msg":"already online"});'
        with mock.patch.object(mod, "curl_get", return_value=body):
            with self.assertRaisesRegex(mod.AuthError, "未返回成功结果"):
                mod.get_observed_ipv6("enp7s0")

    def test_wired_detect_can_identify_portal_without_login_ready_ipv6(self):
        with mock.patch.object(
            mod, "interface_is_wireless", return_value=False
        ), mock.patch.object(
            mod, "get_observed_ipv6", return_value=""
        ) as observed:
            self.assertEqual(
                mod.detect_login_type(
                    "enp7s0", False, require_login_ready=False
                ),
                "3",
            )
            observed.assert_called_once_with(
                "enp7s0", timeout=3, retries=1, allow_portal_only=True
            )

    def test_doctor_online_does_not_require_login_ready_ipv6(self):
        config = {
            "username": "123",
            "password": "real-secret",
            "type": "auto",
            "connectivity_url": "https://example.com/",
        }
        with mock.patch.object(mod.shutil, "which", return_value="/bin/tool"), mock.patch.object(
            mod, "global_interface_addresses", return_value={"enp7s0": ["172.19.26.49"]}
        ), mock.patch.object(
            mod, "resolve_interface", return_value="enp7s0"
        ), mock.patch.object(
            mod, "interface_is_wireless", return_value=False
        ), mock.patch.object(
            mod, "interface_ipv4", return_value="172.19.26.49"
        ), mock.patch.object(
            mod, "internet_online", return_value=True
        ), mock.patch.object(
            mod, "detect_login_type", return_value="3"
        ) as detect:
            self.assertEqual(mod.do_doctor(args(), config, None), 0)
            detect.assert_called_once_with(
                "enp7s0", False, require_login_ready=False
            )


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          python3 -m py_compile bjut_auth.py
          python3 -m unittest discover -s tests -v

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bjut_auth.py tests/test_type3_online_doctor.py
          git commit -m "Separate Type 3 portal detection from login readiness"
          git push origin HEAD:main
