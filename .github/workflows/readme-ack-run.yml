name: one-shot-readme-ack-run

on:
  push:
    paths:
      - .github/workflows/readme-ack-run.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply README patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update_readme.py
          python3 /tmp/update_readme.py
          grep -q '## 致谢 / Acknowledgements' README.md
          grep -q 'sw1128/bjut_auth_linux' README.md
          grep -q '# 19. 许可与第三方说明' README.md

      - name: Commit README and clean temporary workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/readme-ack-fix.yml .github/workflows/readme-ack-run.yml
          git add README.md
          git commit -m "Improve README acknowledgements"
          git push origin HEAD:main
