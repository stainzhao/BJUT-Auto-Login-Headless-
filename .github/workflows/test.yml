name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python syntax
        run: python -m py_compile bjut_auth.py bjut_relogin.py bjut_ipv6_watch.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell syntax
        run: bash -n install.sh uninstall.sh NetworkManager/dispatcher.d/90-bjut-auto-login

      - name: Network event units
        run: |
          grep -q '^OnUnitInactiveSec=60s$' systemd/bjut-auto-login.timer
          grep -q '^OnActiveSec=2s$' systemd/bjut-auto-login-event.timer
          grep -q '^RemainAfterElapse=no$' systemd/bjut-auto-login-event.timer
          grep -q 'restart --no-block bjut-auto-login-event.timer' NetworkManager/dispatcher.d/90-bjut-auto-login
          grep -q '^ExecStartPost=/usr/local/bin/bjut-ipv6-watch --config /etc/bjut-auto-login.conf$' systemd/bjut-auto-login.service

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CLI without systemd
        run: sudo ./install.sh --no-systemd

      - name: Verify installed files
        run: |
          /usr/local/bin/bjut-auth --version
          /usr/local/bin/bjut-relogin --version
          /usr/local/bin/bjut-ipv6-watch --version
          test "$(stat -c '%a' /usr/local/bin/bjut-auth)" = "755"
          test "$(stat -c '%a' /usr/local/bin/bjut-relogin)" = "755"
          test "$(stat -c '%a' /usr/local/bin/bjut-ipv6-watch)" = "755"
          test "$(stat -c '%a' /etc/bjut-auto-login.conf)" = "600"

      - name: Uninstall
        run: |
          sudo ./uninstall.sh --purge
          test ! -e /usr/local/bin/bjut-auth
          test ! -e /usr/local/bin/bjut-relogin
          test ! -e /usr/local/bin/bjut-ipv6-watch
          test ! -e /etc/bjut-auto-login.conf
