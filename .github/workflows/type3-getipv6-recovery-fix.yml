name: one-shot-type3-getipv6-recovery-fix

on:
  push:
    paths:
      - .github/workflows/type3-getipv6-recovery-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/apply_type3_fix.py
          python3 /tmp/apply_type3_fix.py

      - name: Validate patch
        run: |
          python3 -m py_compile bjut_auth.py
          python3 -m unittest discover -s tests -v
          bash -n install.sh uninstall.sh

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bjut_auth.py tests/test_type3_getipv6_recovery.py README.md
          git commit -m "Fix Type 3 IPv6 discovery recovery"
          git push origin HEAD:main
