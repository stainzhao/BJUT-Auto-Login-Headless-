[BJUT]
username = 25000000
password = change_me

# auto / 1(宿舍) / 2(bjut_wifi) / 3(有线 lgn)
type = auto

# 留空时自动选择校园网接口：
# 优先按校园 Portal 路由识别；单网口会直接选择；双网口无法唯一判断时会安全报错。
# 如需固定，可填写 eno1 / enp7s0 / wlan0 等。
interface =

# 宿舍网或 Wi-Fi 的 HTTPS 不可用时，是否允许回退到 HTTP 明文传输密码。
allow_http_fallback = false

# 用于判断是否真正访问公网。默认使用小米 generate_204 轻量探测地址；也可替换为自己的 HTTP 204 端点。
connectivity_url = http://connect.rom.miui.com/generate_204

# 可选：把上面的健康检查域名固定到指定 IP，绕过 DNS；HTTPS 地址仍保留 SNI/证书校验。
# 例如 connectivity_url = https://check.example.com/204 时填写该域名对应的 VPS IP。
connectivity_resolve_ip =
